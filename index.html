<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f3e9">
  <meta name="color-scheme" content="light">
  <title>过年有招 · 返乡应答手册</title>
  <style>
    :root {
      --paper: #f8f3e9;
      --surface: #fffdf8;
      --ink: #332b25;
      --muted: #6f6054;
      --red: #a3372a;
      --line: #e9ddd0;
      --tint: #faeee7;
      --green: #38594d;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.65;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #91682c; outline-offset: 3px; }
    .shell { width: min(1112px, calc(100% - 64px)); margin: auto; }
    .masthead { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 750; letter-spacing: .06em; }
    .seal { display: grid; place-items: center; width: 33px; height: 33px; border-radius: 8px; color: white; background: var(--red); }
    .seal svg { width: 21px; height: 21px; }
    .offline { color: var(--muted); font-size: .8rem; white-space: nowrap; }
    .offline::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--green); }
    .hero { isolation: isolate; position: relative; overflow: hidden; min-height: 230px; display: flex; align-items: center; padding: 29px 43px 32px; border-radius: 20px; background: #8c3026; color: #fff7e7; }
    .hero-copy { position: relative; z-index: 1; max-width: 100%; }
    .hero-tag { display: flex; align-items: center; gap: 9px; margin: 0 0 8px; color: #ffe0a9; font-size: .82rem; letter-spacing: .13em; }
    .hero-tag::before { content: ""; width: 19px; height: 1px; background: currentColor; }
    h1, h2, p { margin: 0; }
    h1 { font-family: "Songti SC", "SimSun", serif; font-size: clamp(2.65rem, 5.5vw, 4.5rem); font-weight: 800; line-height: 1.13; letter-spacing: .04em; }
    .hero-desc { margin-top: 12px; font-size: .97rem; line-height: 1.7; color: #fff2df; }
    .hero-art { position: absolute; right: 0; bottom: 0; width: min(55%, 575px); height: 100%; }
    .workspace { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; align-items: start; margin-top: 26px; }
    .scene-list, .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 17px; }
    .scene-list { padding: 15px 13px; }
    .list-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 8px 9px; }
    .list-header h2 { font-size: 1rem; }
    .count { color: var(--muted); font-size: .77rem; }
    .scenes { display: grid; gap: 3px; }
    .scene { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 7px 9px; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 9px; text-align: left; font-size: .88rem; }
    .scene:hover { background: #f8f2ea; }
    .scene[aria-current="true"] { border-color: #ebd4c6; background: var(--tint); color: #852d22; font-weight: 750; }
    .number { display: grid; place-items: center; flex: 0 0 27px; height: 25px; background: #f3ebe0; border-radius: 6px; color: #705c4e; font-size: .68rem; font-weight: 650; font-variant-numeric: tabular-nums; }
    .scene[aria-current="true"] .number { background: #a3372a; color: white; }
    .arrow { margin-left: auto; color: #927e70; font-size: 1rem; }
    .detail { padding: 23px 27px 24px; }
    .detail:focus { outline: none; }
    .detail:focus-visible { outline: 2px solid #91682c; outline-offset: 4px; }
    .eyebrow { color: var(--red); font-size: .77rem; font-weight: 750; letter-spacing: .12em; }
    .detail h2 { margin-top: 3px; font-size: clamp(1.45rem, 3.3vw, 1.95rem); line-height: 1.35; }
    .prompt { margin: 7px 0 17px; color: var(--muted); font-size: .87rem; }
    .tones { display: flex; gap: 7px; margin-bottom: 8px; }
    .tone { flex: 1; min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: #f9f4ec; color: #635348; font-size: .86rem; }
    .tone:hover { border-color: #bb8b75; }
    .tone[data-tone="proactive"] { border-color: #c58973; color: #8c372b; font-weight: 750; }
    .tone[aria-pressed="true"] { background: #a3372a; border-color: #a3372a; color: #fff; font-weight: 750; }
    .proactive-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-bottom: 8px; }
    .proactive-options[hidden] { display: none; }
    .strategy { min-height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); font-size: .84rem; }
    .strategy:hover { border-color: #bb8b75; }
    .strategy[aria-pressed="true"] { border-color: #c58973; background: var(--tint); color: #852d22; font-weight: 750; }
    .tone-hint { margin: 0 0 14px; color: var(--muted); font-size: .8rem; }
    .replies { display: grid; gap: 13px; }
    .reply { border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
    .response { background: #fbf0e8; padding: 12px 17px; }
    .response-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .label { color: #8c372b; font-size: .76rem; font-weight: 750; letter-spacing: .08em; }
    .reply h3 { margin: 0; color: #8c372b; font-size: .82rem; font-weight: 750; }
    .copy { display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 4px 8px; color: #853125; background: #fffaf4; border: 1px solid #e8cbbb; border-radius: 7px; font-size: .76rem; white-space: nowrap; }
    .copy:hover { background: #f8e0d4; }
    .copy:focus-visible { outline-offset: 2px; }
    .copy svg { width: 14px; height: 14px; flex-shrink: 0; }
    blockquote { margin: 6px 0 0; font-size: clamp(1.02rem, 2.2vw, 1.24rem); font-weight: 650; line-height: 1.65; }
    .status { font-size: .75rem; color: var(--green); }
    .status span:not(:empty) { display: block; margin-top: 5px; }
    .action { display: flex; align-items: flex-start; gap: 10px; padding: 10px 15px; border-top: 1px solid #dde5db; background: #f0f4ed; }
    .action svg { width: 22px; height: 22px; flex: 0 0 22px; margin-top: 2px; color: var(--green); }
    .action .label { color: var(--green); }
    .action-text { margin-top: 2px; font-size: .88rem; }
    footer { padding: 17px 0 24px; color: var(--muted); font-size: .77rem; }
    footer details { margin-top: 6px; }
    footer summary { cursor: pointer; }
    footer details p { margin: 6px 0; }
    footer ul { margin: 4px 0; padding-left: 22px; }
    footer a { color: var(--red); }
    @media (min-width: 641px) {
      .scene-list { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
    }
    @media (max-width: 800px) {
      .shell { width: calc(100% - 36px); }
      .hero { min-height: 198px; padding: 24px 26px; }
      .hero-art { opacity: .7; }
      .workspace { grid-template-columns: 218px minmax(0, 1fr); gap: 13px; margin-top: 15px; }
      .detail { padding: 17px; }
    }
    @media (max-width: 640px) {
      .shell { width: calc(100% - 28px); }
      .masthead { padding: 12px 0; }
      .hero { min-height: 166px; padding: 18px; border-radius: 14px; }
      .hero-tag { font-size: .72rem; }
      .hero-desc { font-size: .82rem; margin-top: 8px; }
      .hero-art { width: 70%; opacity: .33; }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .scene-list { padding: 8px; }
      .list-header { padding: 3px 5px 6px; }
      .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
      .scene { gap: 5px; padding: 4px; min-height: 44px; font-size: .77rem; }
      .number { flex-basis: 23px; height: 23px; }
      .arrow { display: none; }
      .detail { scroll-margin-top: 10px; }
      .tones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tone[data-tone="proactive"] { grid-column: span 2; }
      .tone, .strategy { min-height: 44px; }
      .response { padding: 11px 13px; }
      .copy { min-height: 44px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <span class="seal" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 9h8M8 12h5"/>
          </svg>
        </span>
        返乡应答手册
      </div>
      <span class="offline">离线可用</span>
    </header>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="hero-tag">春节回家 · 随手查</p>
          <h1 id="page-title">过年有招</h1>
          <p class="hero-desc">遇到难接的话，看看怎么回，<br>也看看接下来能做什么。</p>
        </div>
        <svg class="hero-art" aria-hidden="true" viewBox="0 0 580 250" preserveAspectRatio="xMaxYMax meet">
          <defs>
            <pattern id="windows" width="37" height="22" patternUnits="userSpaceOnUse">
              <rect x="1" y="3" width="27" height="16" rx="4" fill="#9d4130"/>
              <path d="M7 14l8-7m-2 9l8-8" stroke="#f2a570" stroke-width="1" opacity=".6"/>
            </pattern>
          </defs>
          <circle cx="420" cy="86" r="63" fill="#e2a266" opacity=".9"/>
          <circle cx="420" cy="86" r="74" fill="none" stroke="#f4c286" stroke-opacity=".45"/>
          <path d="M75 169 173 111 221 138 318 76 419 138 493 100 580 142V250H75Z" fill="#a74732"/>
          <path d="m27 206 95-38 52 13 82-41 82 38 67-24 74 17 101-39v118H27Z" fill="#b3573d"/>
          <path d="M0 220c130-11 282-9 580 1v29H0Z" fill="#733027"/>
          <path d="M14 228c182-9 384-7 566 0M29 237c172-10 360-7 551 0" stroke="#db9b68" stroke-width="1.2" opacity=".6" fill="none"/>
          <g stroke="#f9d4a2" stroke-linecap="round" fill="none" opacity=".8">
            <path d="M285 39h38m-26 7h39M490 57h57m-44 7h53M528 25h24M368 29v10m-5-5h10M503 102v12m-6-6h12"/>
          </g>
          <g transform="translate(76 166)">
            <path d="M0 3h325c22 0 37 5 56 18l30 20c5 4 2 10-4 10H0Z" fill="#f8d8a4"/>
            <path d="M0 37h398l13 9c2 3-1 5-5 5H0Z" fill="#bf603f"/>
            <path d="M0 15h319v22H0Z" fill="url(#windows)"/>
            <path d="M327 16h36c10 1 19 8 29 15h-53Z" fill="#934033"/>
            <path d="M125 4v46m121-46v46" stroke="#a45b40" stroke-width="2"/>
            <path d="M0 51h393" stroke="#52251e" stroke-width="3"/>
          </g>
        </svg>
      </section>

      <div class="workspace">
        <nav class="scene-list" aria-labelledby="list-title">
          <div class="list-header">
            <h2 id="list-title">选个场景</h2>
            <span id="scene-count" class="count"></span>
          </div>
          <div id="scenes" class="scenes"></div>
        </nav>

        <section id="detail" class="detail" aria-labelledby="scene-title" tabindex="-1">
          <p id="scene-number" class="eyebrow"></p>
          <h2 id="scene-title"></h2>
          <p id="prompt" class="prompt"></p>

          <div class="tones" role="group" aria-label="选择应答方式">
            <button class="tone" type="button" data-tone="gentle" aria-controls="replies" aria-pressed="true">委婉说</button>
            <button class="tone" type="button" data-tone="direct" aria-controls="replies" aria-pressed="false">直接说</button>
            <button class="tone" type="button" data-tone="humor" aria-controls="replies" aria-pressed="false">幽默说</button>
            <button class="tone" type="button" data-tone="followup" aria-controls="replies" aria-pressed="false">被追问</button>
            <button class="tone" type="button" data-tone="proactive" aria-controls="proactive-options replies" aria-pressed="false" aria-expanded="false">主动出击</button>
          </div>
          <div id="proactive-options" class="proactive-options" role="group" aria-label="选择主动应对方式" hidden>
            <button class="strategy" type="button" data-strategy="first" aria-controls="replies" aria-pressed="true">抢先开口</button>
            <button class="strategy" type="button" data-strategy="turn" aria-controls="replies" aria-pressed="false">反客为主</button>
          </div>
          <p id="tone-hint" class="tone-hint"></p>
          <div id="replies" class="replies"></div>
        </section>
      </div>
      <noscript>请启用浏览器的 JavaScript，才能切换场景和查看应答。</noscript>
    </main>
    <footer>
      <p>挑一句你说得出口的，按自己的情况改就好。</p>
      <details>
        <summary>网络灵感与场景参考</summary>
        <p>话术参考了网上的反催婚段子和返乡采访，结合具体问法重新编写。</p>
        <ul>
          <li><a href="https://www.thepaper.cn/newsDetail_forward_16359968" target="_blank" rel="noopener">毕导 · 过年应对亲戚催婚的 50 种方法</a></li>
          <li><a href="https://m.thepaper.cn/newsDetail_forward_32628616" target="_blank" rel="noopener">澎湃号·湃客 · 春节走亲戚，年轻人“反向教育”长辈</a></li>
          <li><a href="https://www.xinhuanet.com/politics/2023-02/14/c_1129362477.htm" target="_blank" rel="noopener">新华网 · 年轻人为何不爱走亲戚了</a></li>
          <li><a href="https://paper.people.com.cn/rmrbhwb/html/2015-01/09/content_1519161.htm" target="_blank" rel="noopener">人民日报海外版 · 年轻人的过年应对办法</a></li>
          <li><a href="https://psy.china.com.cn/2026-02/13/content_43357598.htm" target="_blank" rel="noopener">中国网 · 春节暖心沟通指南</a></li>
        </ul>
      </details>
    </footer>
  </div>

  <template id="reply-template">
    <article class="reply">
      <div class="response">
        <div class="response-top">
          <h3></h3>
          <button class="copy" type="button">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <rect x="7" y="6" width="10" height="11" rx="1.5"/>
              <path d="M13 4V3H3v11h2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            复制这句话
          </button>
        </div>
        <blockquote></blockquote>
        <p class="status" role="status"><span></span></p>
      </div>
      <div class="action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 5h14v14H5zM8 12l3 3 5-6"/>
        </svg>
        <div>
          <p class="label">接下来可以做</p>
          <p class="action-text"></p>
        </div>
      </div>
    </article>
  </template>
  <script>
    const scenes = [
      {
        title: '问工资和存款',
        prompt: '亲戚问：“一个月挣多少？年终奖发了没？攒下钱了吗？”',
        replies: {
          gentle: [
            ['被问月薪', '工作近况可以慢慢聊，工资我就不报数啦。您最近还忙吗？', '说完换一个具体话题，比如问对方年夜饭那道菜是怎么做的。'],
            ['被问年终奖', '年终奖的事我就不细说了。今年倒是学会了不少新东西。', '准备一个能分享的工作小故事，说清楚做了什么就好。'],
            ['爸妈担心你缺钱', '你们要是担心我钱够不够用，咱们吃完饭单独聊聊。', '私下说说近况和你是否需要帮忙，金额按自己愿意分享的程度说。'],
          ],
          direct: [
            ['工资和存款都不公开', '工作近况可以聊，工资和存款是我的私事，我想自己留着。', '如果对方确实在关心你，可以分享一件最近做得顺利的工作小事。'],
            ['别在饭桌上问', '这个话题我不想在饭桌上聊。大家先吃饭吧。', '把话题带回桌上，比如问要不要给大家再添点饭。'],
            ['别转发我的收入', '这事我只跟您说过，麻烦您别往家族群里发。', '如果数字已经被发出，可以私聊发消息的人，请对方撤回。'],
          ],
          humor: [
            ['工资保密，菜谱公开', '工资条不对外开放，红烧肉做法可以公开。您先教教我这盘怎么做的？', '夹一口菜，再问一个做法细节，让新话题接得上。'],
            ['房东先领年终奖', '年终奖啊？房东比我着急，他连钱的去向都替我安排好了。', '适合熟人闲聊。有人接着问具体数字，就切到「被追问」。'],
            ['存款还在长身体', '存款还在长身体，暂时不方便出来见亲戚。', '笑一下就停，顺手给大家添茶，把话题带过去。'],
          ],
          followup: [
            ['“就告诉我一个人”', '我知道你关心我，具体数字我还是不聊。咱们说点别的吧。', '照原话再说一次就够了。对方还问，可以起身倒水，先离开话题。'],
            ['“大概多少也行”', '大概的数我也不方便说。你要是想问我过得怎么样，这个可以聊。', '对方如果转问生活，你可以分享通勤、吃住或喜欢的日常。'],
            ['“是不是挣得太少”', '多少我都不打算公开。咱们今天就聊到这儿吧。', '把手机里的工资单或账单收好，换个座位或去厨房搭把手。'],
          ],
          first: [
            ['回家前｜请爸妈帮你挡一挡', '妈，今年要是有人问我工资，咱就说工作近况可以聊，数字不公开。你别替我报数哈。', '提前私聊爸妈，顺便约好谁来接话，别等有人问了再临时商量。'],
            ['一进门｜先问对方擅长的事', '舅舅，新年好！听说你去年学会做腊肉了，哪天带我看看怎么熏的？', '换成对方确实爱聊的爱好，接着问一个细节，让对方有话可讲。'],
            ['上桌前｜自己播报近况', '我先播个简版近况：今年换了个项目，最有意思的是第一次带新人。你们今年有啥新鲜事？', '用一个真实的小进展代替数字，接着点一位愿意分享的家人。'],
            ['饭前｜和兄弟姐妹约好接话', '待会儿要是有人问咱工资，谁先被点到，另一个就接一句：今年过年有什么好玩的？', '把暗号和换过去的话题一起定下来。轮到对方时，你也替对方接一次。'],
          ],
          turn: [
            ['笑着问回去｜谁在做背调', '您这是拜年，还是帮我做背调？要是拜年，我可先祝您财源广进了。', '适合熟人打趣。把祝福说完就转问对方今年有什么开心事。'],
            ['认真问回去｜您想知道什么', '您问这个，是担心我钱够不够用，还是想了解我那行？这俩可以分开聊。', '让对方选一个方向。说生活或行业近况就好，具体金额自己留着。'],
            ['把年终奖改成年度好物', '奖金金额我就不报了。不过我今年花得最值的是一双通勤鞋。您今年买得最值的是啥？', '先拿自己买过的一件小东西起头，接着聊使用体验，避免变成消费比价。'],
            ['桌上有人爱问数字｜让他来猜菜', '工资数字跳过。您这么会估，要不先猜猜这桌一共包了多少饺子？', '等对方给个数，再请一起包饺子的人揭晓或加入竞猜。'],
          ],
        },
      },
      {
        title: '劝回老家考编',
        prompt: '爸妈说：“在外面租房图啥？回来考个编，离家近还稳。”',
        replies: {
          gentle: [

      const button = document.createElement('button');

      button.setAttribute('aria-controls', 'detail');
      const number = document.createElement('span');
      number.className = 'number';
      number.textContent = String(index + 1).padStart(2, '0');
      number.setAttribute('aria-hidden', 'true');

      arrow.textContent = '›';
      arrow.setAttribute('aria-hidden', 'true');
      button.append(number, title, arrow);
      button.addEventListener('click', () => {

      promptEl.textContent = scene.prompt;
      toneHint.textContent = toneHints[replyGroup];
      replies.textContent = '';
      replies.append(...scene.replies[replyGroup].map(renderReply));
      proactiveOptions.hidden = !isProactive;
      toneButtons.find(button => button.dataset.tone === 'proactive').setAttribute('aria-expanded', String(isProactive));
      sceneButtons.forEach((button, index) => button.setAttribute('aria-current', String(index === sceneIndex)));
      toneButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.tone === tone)));
      strategyButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.strategy === strategy)));

      copy.setAttribute('aria-label', '复制：' + label);
      quote.textContent = line;
      card.querySelector('.action-text').textContent = step;
      copy.addEventListener('click', () => copyReply(quote, copy, status));
      return card;
    }

    toneButtons.forEach(button => {
      button.addEventListener('click', () => {
        if (tone === button.dataset.tone) return;
        tone = button.dataset.tone;
        render();
      });
    });

    strategyButtons.forEach(button => {
      button.addEventListener('click', () => {
        if (strategy === button.dataset.strategy) return;
        strategy = button.dataset.strategy;
        render();
      });
    });

    function copyWithSelection(line, button) {
      const field = document.createElement('textarea');
      field.value = line;
      field.setAttribute('readonly', '');
      field.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
      document.body.append(field);
      field.select();
      field.setSelectionRange(0, line.length); // iOS needs this to select text in a readonly field
      let copied = false;
      try { copied = document.execCommand('copy'); } catch { /* blocked by the browser */ }
      field.remove();
      button.focus({ preventScroll: true });
      return copied;
    }

    async function copyReply(quote, button, status) {
      const line = quote.textContent;
      replies.querySelectorAll('.status span').forEach(span => { span.textContent = ''; });
      // Copy synchronously first so the click still counts as a user gesture (Safari/iOS).
      let copied = copyWithSelection(line, button);
      if (!copied && navigator.clipboard) {
        try {
          await navigator.clipboard.writeText(line);
          copied = true;
        } catch { /* local files and strict settings can block this API */ }
      }
      if (!quote.isConnected) return;
      if (!copied) {
        const range = document.createRange();
        range.selectNodeContents(quote);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }
      status.textContent = copied ? '已复制' : '这句话已选中，请长按或右键手动复制。';
    }

    render();
  </script>
</body>
</html>
